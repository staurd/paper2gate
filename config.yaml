llm:
  provider: deepseek           # anthropic | openai | deepseek
  common:
    max_tokens: 8192
    temperature: 0.2
    # Character budget for the paper text sent to the extraction prompt. The
    # references section is trimmed first, so this only needs to cover the body.
    # Lower it to trade extraction cost/time for depth of reading.
    max_paper_chars: 100000
  providers:
    deepseek:
      model: deepseek-v4-pro
      # Override per stage (optional):
      # extract_model: deepseek-reasoner
      # generate_model: deepseek-chat
      api_key: ${DEEPSEEK_API_KEY}
      base_url: https://api.deepseek.com
    openai:
      model: gpt-5.6-terra
      api_key: ${OPENAI_API_KEY}
      base_url: https://zyrus.aitoken.credit/v1
  vision:
    # Disabled by default because page images add latency and token cost.
    enabled: true
    provider: openai
    model: gpt-5.6-terra
    api_key: ${OPENAI_API_KEY}
    base_url: https://zyrus.aitoken.credit/v1
    max_tokens: 4096
    temperature: 0.1

output:
  base_dir: outputs

iverilog:
  # Empty means search PATH. Override with PAPER2GATE_IVERILOG_BINARY.
  binary: ""
  flags: "-g2012"

vivado:
  # Empty means search PATH. Override with PAPER2GATE_VIVADO_BINARY.
  binary: ""
  # Synthesis target part. Leave empty to use the device extracted from the
  # paper (falling back to xc7a35tcsg324-1 when the paper states none); set it
  # to pin every run to your own board, overriding the paper.
  part: ""
