llm:
  provider: deepseek           # anthropic | openai | deepseek
  model: deepseek-v4-pro
  # Override per stage (optional):
  # extract_model: deepseek-reasoner   # reasoning model for complex extraction
  # generate_model: deepseek-chat      # standard model for code generation
  api_key: ${DEEPSEEK_API_KEY}  # resolved from env var
  max_tokens: 8192
  temperature: 0.2
  # Character budget for the paper text sent to the extraction prompt. The
  # references section is trimmed first, so this only needs to cover the body.
  # Lower it to trade extraction cost/time for depth of reading.
  max_paper_chars: 100000

output:
  base_dir: outputs

iverilog:
  # Path to iverilog binary. Leave as "iverilog" to find on PATH,
  # or set absolute path e.g. "C:/iverilog/bin/iverilog.exe"
  binary: D:/Program Files (x86)/iverilog/bin/iverilog.exe
  # Extra flags passed to iverilog (e.g., "-g2012" for SystemVerilog support)
  flags: "-g2012"

yosys:
  binary: E:/download/oss-cad-suite/bin/yosys.exe
  lib_path: E:/download/oss-cad-suite/lib

vivado:
  binary: D:/Vivado2018.3/Vivado/2018.3/bin/vivado.BAT
  # Synthesis target part. Leave empty to use the device extracted from the
  # paper (falling back to xc7a35tcsg324-1 when the paper states none); set it
  # to pin every run to your own board, overriding the paper.
  part: ""
