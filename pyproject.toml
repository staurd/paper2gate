[project]
name = "paper2gate"
version = "0.1.0"
description = "LLM-driven paper-to-Verilog code generation for PQC hardware"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "anthropic>=0.34.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "rich>=13.7.0",
]

[project.scripts]
paper2gate = "src.main:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
